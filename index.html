    <script>
      (function() {
        try {
          const raw = localStorage.getItem('studyflow_settings_v1');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
